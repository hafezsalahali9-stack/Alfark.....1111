<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdStudio – إعلانات بالذكاء الاصطناعي</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--tx:#f2f4ff;--mut:#9aa3c7;--ac:#ffb000;--bd:#2a3050}
@media(prefers-color-scheme:light){:root{--bg:#f4f5fb;--card:#fff;--tx:#14172b;--mut:#5b6385;--bd:#dfe2f0}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:0 0 10px}input,select,textarea,button{width:100%;font:inherit;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
button{background:var(--ac);color:#111;font-weight:700;border:0;cursor:pointer}button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:14px}.plan{display:flex;justify-content:space-between;align-items:center;gap:10px}.plan button{width:auto;padding:9px 16px}
#msg{color:#ff6b6b;min-height:20px}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;padding:14px 6px}pre{white-space:pre-wrap;font:inherit;background:rgba(127,127,127,.1);padding:12px;border-radius:10px}
</style>
</head>
<body><main>
<h1>🎬 AdStudio</h1><p class="mut" id="who"></p><div id="msg"></div>

<section id="vAuth" class="card hide"><h2>الدخول / إنشاء حساب</h2>
<input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
<input id="pw" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="current-password">
<button onclick="auth('login')">دخول</button><button class="alt" onclick="auth('register')">حساب جديد</button></section>

<section id="vSurvey" class="card hide"><h2>استبيان تفعيل الحساب</h2>
<input id="s_business" placeholder="ما نوع نشاطك التجاري؟">
<select id="s_platform"><option value="">أين تعلن؟</option><option>فيسبوك</option><option>إنستغرام</option><option>تيك توك</option><option>أخرى</option></select>
<select id="s_budget"><option value="">ميزانية الإعلان الشهرية</option><option>أقل من 100$</option><option>100–500$</option><option>أكثر من 500$</option></select>
<input id="s_goal" placeholder="هدفك الرئيسي (مبيعات، عملاء جدد...)">
