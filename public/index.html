<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdStudio – إعلانات بالذكاء الاصطناعي</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--tx:#f2f4ff;--mut:#9aa3c7;--ac:#ffb000;--bd:#2a3050}
@media(prefers-color-scheme:light){:root{--bg:#f4f5fb;--card:#fff;--tx:#14172b;--mut:#5b6385;--bd:#dfe2f0}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:22px;margin:8px 0}h2{font-size:17px;margin:0 0 10px}input,select,textarea,button{width:100%;font:inherit;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
button{background:var(--ac);color:#111;font-weight:700;border:0;cursor:pointer}button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:14px}.plan{display:flex;justify-content:space-between;align-items:center;gap:10px}.plan button{width:auto;padding:9px 16px}
#msg{color:#ff6b6b;min-height:20px}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:600;padding:14px 6px}pre{white-space:pre-wrap;font:inherit;background:rgba(127,127,127,.1);padding:12px;border-radius:10px}
</style>
</head>
<body><main>
<h1>🎬 AdStudio</h1><p class="mut" id="who"></p><div id="msg"></div>

<section id="vHome" class="card hide"><h2>عندك كود اشتراك؟</h2>
<input id="cd" placeholder="AD-XXXX-XXXX" autocapitalize="characters" dir="ltr"><button onclick="enter()">دخول</button></section>
<section id="vPlans" class="card hide"><h2>اختر خطتك</h2><p class="mut">بدون حساب: ادفع، نأكّد الدفع، ويصلك كود دخول.</p><div id="plans"></div></section>
<section id="vOrder" class="card hide"><button class="alt" onclick="init()">← رجوع</button><h2 id="ot"></h2>
<input id="o_name" placeholder="اسمك"><input id="o_contact" placeholder="رقم واتساب أو معرّف تلغرام" dir="ltr">
<input id="o_biz" placeholder="نوع نشاطك (اختياري)"><button onclick="order()">متابعة للدفع</button></section>
<section id="vPay" class="card hide"><h2>الدفع</h2><pre id="pi"></pre><a id="pl" class="hide" href="#"><button>ادفع الآن (عملات رقمية)</button></a>
<input id="ref" placeholder="رقم العملية / ملاحظة الدفع (اختياري)"><button onclick="claim()">✅ دفعت، أبلغ الإدارة</button></section>
<section id="vWait" class="card hide"><h2 id="wt">بانتظار تأكيد الدفع…</h2><p class="mut" id="wm">يصلنا إشعار فوراً، وسيظهر كودك هنا بعد التأكيد. احتفظ بهذه الصفحة أو برابطها.</p>
<pre id="wc" class="hide" dir="ltr" style="font-size:22px;text-align:center"></pre><button id="we" class="hide" onclick="enterWith($('wc').textContent)">ادخل الآن</button></section>
<section id="vTools" class="card hide"><h2>أدواتك</h2><p class="mut" id="quota"></p><div id="grid" class="grid"></div></section>
<section id="vRun" class="card hide"><button class="alt" onclick="init()">← رجوع</button><h2 id="tn"></h2>
<select id="dl"></select><textarea id="br" rows="5" placeholder="صف منتجك/نشاطك والجمهور والعرض بأي تفاصيل لديك"></textarea>
<button id="rb" onclick="runTool()">توليد</button><pre id="res" class="hide"></pre><button class="alt hide" id="cp" onclick="navigator.clipboard.writeText($('res').textContent)">نسخ النتيجة</button></section>
<section id="vStudio" class="card hide"><button class="alt" onclick="init()">← رجوع</button><h2>استوديو الإعلان (فيديو)</h2><p class="mut" id="quota2"></p>
<input type="file" id="img" accept="image/*"><input id="pn" placeholder="اسم المنتج"><input id="of" placeholder="العرض">
<textarea id="sc" rows="4" placeholder="نص الإعلان الصوتي"></textarea>
<button id="go" onclick="produce()">إنتاج الإعلان</button><p class="mut" id="st"></p></section>
<button class="alt hide" id="out" onclick="logout()">تسجيل الخروج</button>
</main>
<script>
const $=id=>document.getElementById(id);let T='';try{T=localStorage.getItem('t')||''}catch(e){}
const show=(...ids)=>['vHome','vPlans','vOrder','vPay','vWait','vTools','vRun','vStudio'].forEach(i=>$(i).classList.toggle('hide',!ids.includes(i)));
const err=m=>$('msg').textContent=m||'';
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T,...(o.headers||{})}});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'خطأ'),{code:d.code});return d}
function logout(){T='';try{localStorage.removeItem('t')}catch(e){}init()}
async function enterWith(c){try{err();T=c.trim().toUpperCase();await api('/api/login-code',{method:'POST'});try{localStorage.setItem('t',T)}catch(e){}history.replaceState(0,'',location.pathname);init()}catch(e){T='';err(e.message)}}
const enter=()=>enterWith($('cd').value);
let PL='',PI={},OID=null,poll=null;
async function init(){
 clearInterval(poll);err();
 const q=new URLSearchParams(location.search).get('order');
 if(q){OID=q;return wait()}
 if(!T){const r=await api('/api/plans');PI=r;$('out').classList.add('hide');$('who').textContent='';
  $('plans').innerHTML=Object.entries(r.plans).map(([k,v])=>`<div class="plan"><div><b>${v.name}</b><div class="mut">${v.price}$ · ${v.daily} فيديو/يوم · ${v.tools} أداة/يوم</div></div><button onclick="pick('${k}')">اشترك</button></div><hr style="border:0;border-top:1px solid var(--bd)">`).join('');
  return show('vHome','vPlans')}
 try{const m=await api('/api/me');$('out').classList.remove('hide');$('who').textContent=m.name;
  if(!m.active){err('انتهى اشتراكك، اطلب كوداً جديداً');return logout()}
  const q2=`الخطة: ${m.plan} · أدوات ${m.toolsUsed}/${m.toolLimit} · فيديو ${m.usedToday}/${m.dailyLimit} اليوم · ينتهي ${new Date(m.expires).toLocaleDateString('ar')}`;
  $('quota').textContent=q2;$('quota2').textContent=q2;
  const t=await api('/api/tools');D=t.dialects;
  $('dl').innerHTML=D.map(x=>`<option>${x}</option>`).join('');
  $('grid').innerHTML=`<button onclick="show('vStudio')">🎥<br>فيديو إعلاني</button>`+t.tools.map(x=>`<button onclick="openTool('${x.id}','${x.name}')">${x.icon}<br>${x.name}</button>`).join('');
  show('vTools')
 }catch(e){logout()}}
function pick(k){PL=k;$('ot').textContent=PI.plans[k].name+' — '+PI.plans[k].price+'$';show('vOrder')}
async function order(){try{err();const d=await api('/api/order',{method:'POST',body:JSON.stringify({plan:PL,name:$('o_name').value,contact:$('o_contact').value,business:$('o_biz').value})});
 OID=d.orderId;try{localStorage.setItem('o',OID)}catch(e){}
 $('pi').textContent=PI.payInfo||'سيتواصل معك فريقنا بتفاصيل الدفع.';$('pi').classList.toggle('hide',!!d.invoiceUrl&&!PI.payInfo);
 $('pl').classList.toggle('hide',!d.invoiceUrl);if(d.invoiceUrl)$('pl').href=d.invoiceUrl;show('vPay')}catch(e){err(e.message)}}
async function claim(){try{err();await api('/api/order/'+OID+'/claim',{method:'POST',body:JSON.stringify({ref:$('ref').value})});wait()}catch(e){err(e.message)}}
function wait(){show('vWait');try{localStorage.setItem('o',OID)}catch(e){}
 const chk=async()=>{try{const s=await api('/api/order/'+OID);
  if(s.status==='approved'){clearInterval(poll);$('wt').textContent='✅ تم تأكيد الدفع';$('wm').textContent='هذا كود دخولك، احتفظ به:';$('wc').textContent=s.code;$('wc').classList.remove('hide');$('we').classList.remove('hide')}
  else if(s.status==='rejected'){clearInterval(poll);$('wt').textContent='لم يتم تأكيد الدفع';$('wm').textContent='تواصل مع الإدارة.'}
  else if(s.status==='new'){$('wt').textContent='لم يصلنا إبلاغ دفع بعد';$('wm').textContent='أكمل الدفع ثم اضغط «دفعت».'}
  else{$('wt').textContent='بانتظار تأكيد الدفع…'}}catch(e){err(e.message)}};
 chk();clearInterval(poll);poll=setInterval(chk,6000)}
let D=[],TL='';
function openTool(id,n){TL=id;$('tn').textContent=n;$('res').classList.add('hide');$('cp').classList.add('hide');err();show('vRun')}
async function runTool(){try{err();$('rb').disabled=true;$('rb').textContent='جاري التوليد...';
 const d=await api('/api/tool/run',{method:'POST',body:JSON.stringify({tool:TL,brief:$('br').value,dialect:$('dl').value})});
 $('res').textContent=d.text;$('res').classList.remove('hide');$('cp').classList.remove('hide')}catch(e){err(e.message)}
 $('rb').disabled=false;$('rb').textContent='توليد'}
async function pay(plan){try{err();const d=await api('/api/checkout',{method:'POST',body:JSON.stringify({plan})});location.href=d.url}catch(e){err(e.message)}}
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function produce(){try{err();const f=$('img').files[0];if(!f)throw new Error('ارفع صورة المنتج');
 $('go').disabled=true;$('st').textContent='جاري البدء...';
 const d=await api('/api/start-production',{method:'POST',body:JSON.stringify({imageBase64:await b64(f),productName:$('pn').value,offer:$('of').value,script:$('sc').value})});
 const iv=setInterval(async()=>{try{const s=await api(`/api/check-task-status?taskId=${d.taskId}`);$('st').textContent=s.message||'';
  if(s.status==='completed'){clearInterval(iv);$('go').disabled=false;const r=await fetch(s.videoUrl,{headers:{Authorization:'Bearer '+T}});
   const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='ad.mp4';a.click();$('st').textContent='تم! تم تنزيل الفيديو.';init()}
  if(s.status==='failed'){clearInterval(iv);$('go').disabled=false;err(s.error)}}catch(e){clearInterval(iv);$('go').disabled=false;err(e.message)}},5000)
 }catch(e){$('go').disabled=false;err(e.message)}}
init();
</script></body></html>
